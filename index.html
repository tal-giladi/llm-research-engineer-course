<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM Research Engineer — Language Modeling from Scratch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="A complete, implementation-heavy course that takes an experienced software engineer from the mathematics of language modeling to training, aligning, and deploying frontier-style LLMs — every algorithm derived, hand-computed, implemented from scratch, tested, benchmarked, and connected to the research paper it comes from. Built on the backbone of Stanford CS336.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    :root { --theme-color: #0b7285; }
    .sidebar { padding-top: 20px; }
    .sidebar > h1 { margin: 0 20px 10px; font-size: 1.1em; }
    .markdown-section { max-width: 920px; }
    /* Callout boxes used throughout the lessons */
    .callout { border-left: 4px solid var(--theme-color); background: #eef7f9;
      padding: 0.8em 1em; margin: 1.2em 0; border-radius: 0 6px 6px 0; }
    .callout.pt { border-left-color: #ee4c2c; background: #fdf0ec; }
    .callout.warn { border-left-color: #e0a800; background: #fdf9e7; }
    .callout.key { border-left-color: #1f7a5a; background: #eef7f3; }
    .callout.paper { border-left-color: #6741d9; background: #f3f0fc; }
    .callout p:first-child { margin-top: 0; }
    .callout p:last-child { margin-bottom: 0; }
    .prereq { font-size: 0.92em; background: #f4f4f8; border: 1px solid #e2e2ee;
      border-radius: 8px; padding: 0.6em 1em; margin-bottom: 1.5em; }
    .prereq p { margin: 0.3em 0; }
    .hw { font-size: 0.9em; background: #f0f6ff; border: 1px solid #d0e2ff;
      border-radius: 8px; padding: 0.6em 1em; margin: 1.2em 0; }
    .hw p { margin: 0.3em 0; }
    .katex { font-size: 1.05em; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.3em 0; }
    table { display: table; width: 100%; }
    .badge { display: inline-block; font-size: 0.75em; font-weight: 600; padding: 1px 8px;
      border-radius: 10px; background: #e7f0f2; color: #0b7285; margin-left: 6px; vertical-align: middle; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'LLM Research Engineer',
      repo: 'https://github.com/tal-giladi/llm-research-engineer-course',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      maxLevel: 4,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      search: {
        placeholder: 'Search the course...',
        noData: 'No results.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      count: { countable: true },
      plugins: [
        function (hook) {
          // Render math with KaTeX auto-render AFTER docsify writes the DOM,
          // so $...$ inside raw-HTML blocks (prereq / callout divs) also renders.
          hook.doneEach(function () {
            if (window.renderMathInElement) {
              document.querySelectorAll('.markdown-section').forEach(function (el) {
                window.renderMathInElement(el, {
                  delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false }
                  ],
                  ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                  throwOnError: false
                });
              });
            }
          });
        }
      ]
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-count/dist/countable.min.js"></script>
  <!-- KaTeX + auto-render extension (walks the rendered DOM, incl. HTML blocks) -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
