[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llmre"
version = "0.1.0"
description = "LLM Research Engineer course — a coherent, from-scratch LLM training codebase built up module by module."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tal Giladi" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Installed only where the relevant module needs them; kept optional so CPU-only
# development works for most of the course.
extras = [
    "triton; platform_system=='Linux'",
    "datasets",
    "transformers",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
