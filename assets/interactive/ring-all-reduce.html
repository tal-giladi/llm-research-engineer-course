<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ring all-reduce · three workers</title>
<style>
:root{color-scheme:light;--background:#fff;--foreground:#1a1c1f;--muted:#566775;--border:#c9d3da;--viz-series-1:#339cff}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{padding:16px}
.viz-controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.btn{font:inherit;border:1px solid var(--border);border-radius:7px;background:var(--background);color:var(--foreground);padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--viz-series-1)}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--viz-series-1);border-color:var(--viz-series-1);color:#fff}
.btn:focus-visible{outline:3px solid var(--viz-series-1);outline-offset:3px}
[data-status]{margin-left:6px;font-weight:500}
.text-small{font-size:13px;color:var(--muted);text-align:center}
#ring-demo .ring-figure{display:block;width:100%;height:410px;overflow:visible}
#ring-demo .ring-figure text{fill:var(--foreground);font-family:inherit;font-weight:400}
#ring-demo .link{fill:none;stroke:var(--border);stroke-width:2}
#ring-demo .chunk{fill:color-mix(in srgb,var(--viz-series-1) 14%,var(--background));stroke:none}
#ring-demo .chunk.done{fill:color-mix(in srgb,var(--viz-series-1) 32%,var(--background))}
#ring-demo .packet{fill:var(--background);stroke:var(--viz-series-1);stroke-width:2}
#ring-demo .node-title{font-weight:500}
#ring-demo .inactive{opacity:.32}
</style></head><body><main>
<div id="ring-demo">
  <div class="viz-controls">
    <button type="button" class="btn" data-action="back">Back</button>
    <button type="button" class="btn btn-primary" data-action="play">Play</button>
    <button type="button" class="btn" data-action="next">Next</button>
    <span data-status aria-live="polite">Initial vectors</span>
  </div>
  <svg class="ring-figure" role="img" aria-label="Three workers exchange vector chunks clockwise. Reduce-scatter adds chunks; all-gather copies the completed sums."></svg>
  <div class="text-small" data-detail aria-live="polite">3 workers · 3 chunks per vector · 1 number per chunk</div>
</div>
</main>
<script>
(()=>{
 const root=document.getElementById('ring-demo'), svg=root.querySelector('svg');
 const status=root.querySelector('[data-status]'),detail=root.querySelector('[data-detail]');
 const back=root.querySelector('[data-action="back"]'),next=root.querySelector('[data-action="next"]'),play=root.querySelector('[data-action="play"]');
 const ns='http://www.w3.org/2000/svg', initial=[[1,2,3],[4,5,6],[7,8,9]], rounds=[];
 let data=initial.map(x=>x.slice()), known=initial.map(()=>[true,true,true]);
 for(let t=0;t<4;t++){
   const before=data.map(x=>x.slice()), beforeKnown=known.map(x=>x.slice()),add=t<2,s=t%2;
   const messages=[0,1,2].map(r=>{const c=add?(r-s+3)%3:(r+1-s+3)%3;return {from:r,to:(r+1)%3,c,value:before[r][c]};});
   const equations=['','',''];
   for(const m of messages){const old=data[m.to][m.c];data[m.to][m.c]=add?old+m.value:m.value;equations[m.to]=add?`${old} + ${m.value} = ${data[m.to][m.c]}`:`copy ${m.value} into c${m.c}`;known[m.to][m.c]=true;}
   if(t===1)known=known.map((_,r)=>[0,1,2].map(c=>c===(r+1)%3));
   rounds.push({before,beforeKnown,after:data.map(x=>x.slice()),afterKnown:known.map(x=>x.slice()),messages,equations,add});
 }
 const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 let step=0,running=false,raf=0,start=0,progress=0;
 function el(tag,attrs={},text){const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e;}
 function draw(){
   const width=Math.max(300,root.clientWidth),height=410;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.replaceChildren();
   const pos=[[width/2,66],[width-77,294],[77,294]];
   const active=step>0,idx=active?Math.floor((step-1)/2):0,travel=active&&step%2===1,round=rounds[idx];
   const values=!active?initial:travel?round.before:round.after;
   const available=!active?initial.map(()=>[true,true,true]):travel?round.beforeKnown:round.afterKnown;
   const defs=el('defs'),marker=el('marker',{id:'ring-arrow',viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'var(--border)'}));defs.append(marker);svg.append(defs);
   const paths=[];
   for(let r=0;r<3;r++){
     const a=pos[r],b=pos[(r+1)%3];let d;
     if(r===0)d=`M ${a[0]+57} ${a[1]+35} Q ${width-22} 154 ${b[0]+15} ${b[1]-27}`;
     else if(r===1)d=`M ${a[0]-48} ${a[1]+51} Q ${width/2} 382 ${b[0]+48} ${b[1]+51}`;
     else d=`M ${a[0]-15} ${a[1]-27} Q 22 154 ${b[0]-57} ${b[1]+35}`;
     const path=el('path',{d,class:'link','marker-end':'url(#ring-arrow)'});svg.append(path);paths.push(path);
   }
   svg.append(el('text',{x:width/2,y:195,'text-anchor':'middle'},!active?'Ring':round.add?'Add':'Copy'));
   svg.append(el('text',{x:width/2,y:216,'text-anchor':'middle'},!active?'w0 → w1 → w2 → w0':`Round ${idx%2+1} / 2`));
   pos.forEach(([x,y],r)=>{
     svg.append(el('text',{x,y:y-12,'text-anchor':'middle',class:'node-title'},`Worker w${r}`));
     for(let c=0;c<3;c++){
       const cx=x-63+c*43,g=el('g',{class:available[r][c]?'':'inactive'});
       g.append(el('rect',{x:cx,y,width:40,height:38,rx:4,class:'chunk'+(active&&(!round.add||idx===1&&!travel)&&available[r][c]?' done':'')}));
       g.append(el('text',{x:cx+20,y:y+25,'text-anchor':'middle'},values[r][c]));
       g.append(el('text',{x:cx+20,y:y+55,'text-anchor':'middle'},`c${c}`));svg.append(g);
     }
     if(active&&!travel)svg.append(el('text',{x,y:y+79,'text-anchor':'middle'},round.equations[r]));
   });
   if(travel){for(const m of round.messages){const p=paths[m.from],point=p.getPointAtLength(p.getTotalLength()*(.08+.84*progress));const g=el('g');g.append(el('rect',{x:point.x-33,y:point.y-15,width:66,height:30,rx:6,class:'packet'}));g.append(el('text',{x:point.x,y:point.y+5,'text-anchor':'middle'},`c${m.c}: ${m.value}`));svg.append(g);}}
   status.textContent=!active?'Initial vectors':`${round.add?'Reduce-scatter':'All-gather'} · ${idx%2+1}/2 · ${travel?'send':'received'}`;
   detail.textContent=!active?'3 workers · 3 chunks per vector · 1 number per chunk':step===8?'Complete: every worker holds [12, 15, 18].':travel?'All three sends happen simultaneously; each sends only one chunk.':step===4?'Each worker owns one complete sum; faded slots are stale.':round.add?'Add the received chunk to the same position in the local vector.':'Copy the received sum; no addition during all-gather.';
   back.disabled=step===0;next.disabled=step===8;play.textContent=running?'Pause':step===8?'Replay':'Play';
 }
 function stop(){running=false;cancelAnimationFrame(raf);draw();}
 function frame(now){if(!running)return;if(!start)start=now;const elapsed=now-start;progress=step%2?(reducedMotion?.5:Math.min(1,elapsed/2600)):0;draw();const duration=step%2?3000:2600;if(elapsed>=duration){if(step===8){stop();return;}step++;start=now;progress=0;}raf=requestAnimationFrame(frame);}
 play.addEventListener('click',()=>{if(running){stop();return;}if(step===8)step=0;running=true;start=0;raf=requestAnimationFrame(frame);draw();});
 back.addEventListener('click',()=>{stop();step=Math.max(0,step-1);progress=.5;draw();});
 next.addEventListener('click',()=>{stop();step=Math.min(8,step+1);progress=.5;draw();});
 new ResizeObserver(draw).observe(root);draw();
})();
</script>
</body></html>
